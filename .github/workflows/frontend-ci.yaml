name: Build and Push Frontend Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: audit dependencies
        run: npm audit

      - name: audit fix
        run: npm audit fix

      - name: Build
        run: npm run build

  push:
    runs-on: ubuntu-latest
    needs: build
    environment: test
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/finalproject:latest
            ${{ secrets.DOCKER_USERNAME }}/finalproject:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/finalproject:v${{ github.run_number }}
