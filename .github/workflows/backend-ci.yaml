name: Build and Push Backend Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm 
          cache-dependency-path: backend/package-lock.json 

      - name: Install dependencies
        run: npm ci 

      - name: NPM audit
        run: npm audit

      - name: audit fix
        run: npm audit --fix

      - name: Test
        run: npm test

  push:
    runs-on: ubuntu-latest
    environment: test
    needs: build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/finalbackend:latest
            ${{ secrets.DOCKER_USERNAME }}/finalbackend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/finalbackend:v${{ github.run_number }}
